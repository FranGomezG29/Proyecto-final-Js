<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuore | Apadriná o doná</title>
    <script src="./js/main.js" defer></script>
    <link rel="icon" type="image/webp" href="./assets/img/logo.webp">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Cuore</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="./pages/carrito.html">Mi carrito</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Ayudá al refugio Cuore</h1>
            <p>Apadriná a un animal por mes o doná insumos para su cuidado diario.</p>
        </section>

        <section id="seccion-buscador">
            <input type="text" id="input-buscar" placeholder="Buscar por nombre...">
        </section>

        <section class="seccion-catalogo">
            <h2>Apadriná un animal</h2>
            <div id="contenedor-apadrinamiento">
                <p id="cargando-apadrinamiento">Cargando animales...</p>
            </div>
        </section>

        <section class="seccion-catalogo">
            <h2>Doná insumos para el refugio</h2>
            <div id="contenedor-insumos">
                <p id="cargando-insumos">Cargando insumos...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Cuore. Refugio de animales.</p>
    </footer>
